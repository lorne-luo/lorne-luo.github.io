{% for item in include.content %}
<div class="showcase-item">
  <div class="image">
    <img src="{{ item.image | relative_url }}" alt="{{ item.title | escape }}">
  </div>
  <div class="description">
    <h3 class="title">{{ item.title }}</h3>
    {{ item.description | markdownify }}
  </div>
</div>
{% endfor %}
